[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "volttron-lib-archivable"
version = "0.1.0"
description = "A lib-archivable data manager that archives through the transactive-node historian on the VOLTTRON message bus."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Pacific Northwest National Laboratory" }]
dependencies = [
    "lib-archivable",
    "volttron-core>=2.0.0rc0",
    "gevent>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["volttron_archivable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
